name = "cherry-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Routes — uncomment and set your worker domain or custom domain
# routes = [{ pattern = "proxy.yourdomain.com/*", custom_domain = true }]

[vars]
# Non-secret config vars go here.
# Secrets (set via wrangler secret put):
#   PROXY_KEY   — proxy auth key (default client value '1206')
#   SYNC_SECRET — HMAC secret for favorites bucket keys (any long random string)

# Favorites sync KV. Create once:  wrangler kv namespace create FAVS
# then paste the returned id below.
[[kv_namespaces]]
binding = "FAVS"
id = "f5fd540729014dcba1363a085a2c01f0"
